{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>Fresh food, from farms near you</h1>
  <p>See which farms near {{ request.GET.place or 'you' }} have eggs, milk, honey or vegetables available today. Call or WhatsApp the farmer, pick up at the gate, pay on the spot.</p>
  <div class="cta">

  </div>
</section>
{% endblock %}
