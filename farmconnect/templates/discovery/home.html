{% extends "base.html" %}
{% block title %}Map — Local Farm Map{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
{% endblock %}
{% block content %}
<p class="flex items-center gap-1.5 text-xs font-medium text-leaf-800">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
    <path fill-rule="evenodd" d="M10 1.5a5.5 5.5 0 0 0-5.5 5.5c0 3.4 4.3 9 5.16 10.05a.44.44 0 0 0 .68 0C11.2 16 15.5 10.4 15.5 7A5.5 5.5 0 0 0 10 1.5Zm0 7.75a2.25 2.25 0 1 1 0-4.5 2.25 2.25 0 0 1 0 4.5Z" clip-rule="evenodd"/>
  </svg>
  Pay at pickup. The platform never holds your money.
</p>

<div class="mt-2 space-y-2">
  <div class="flex flex-wrap items-center gap-2">
    <button id="chip-location" type="button"
            class="chip chip-idle gap-1.5 font-semibold"
            aria-haspopup="dialog" aria-expanded="false">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-leaf-700" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="m9.69 18.442a.75.75 0 0 0 .62 0c.414-.228 1.084-.664 1.86-1.29C13.9 15.776 16.5 12.99 16.5 9.75a6.5 6.5 0 1 0-13 0c0 3.24 2.6 6.026 4.33 7.402.776.626 1.446 1.062 1.86 1.29ZM10 11.5a2.25 2.25 0 1 0 0-4.5 2.25 2.25 0 0 0 0 4.5Z" clip-rule="evenodd"/>
      </svg>
      <span id="chip-location-text">Near Kisii University · 15 km</span>
    </button>
    <nav id="pill-row" class="flex flex-wrap gap-2" aria-label="Filter by product">
      <button type="button" data-product="" class="chip chip-active">All <span data-count>0</span></button>
      {% for p in products %}
      <button type="button" data-product="{{ p.slug }}" class="chip chip-idle">
        {{ p.name }} <span data-count>0</span>
      </button>
      {% endfor %}
    </nav>
  </div>

  <div id="loc-popover" role="dialog" aria-label="Choose area and radius" hidden
       class="rounded-card border border-soil-200 bg-white p-4 shadow-lg">
    <div>
      <label class="field-label" for="place-select">Area</label>
      <select id="place-select" class="w-full rounded-lg border border-soil-300 bg-white px-3 py-2.5 text-base text-soil-900">
        <option value="">My current location</option>
        {% for pl in places %}
        <option value="{{ pl.slug }}" {% if selected_place == pl.slug %}selected{% endif %}>{{ pl.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mt-3">
      <label class="field-label" for="radius-input">Search radius: <span id="radius-label">15 km</span></label>
      <input id="radius-input" type="range" min="3" max="15" step="1" value="15"
             class="h-11 w-full accent-leaf-700">
    </div>
    <div class="mt-3 flex gap-2">
      <button id="btn-use-location" type="button" class="btn btn-secondary flex-1">My location</button>
      <button id="btn-apply-area" type="button" class="btn btn-primary flex-1">Apply</button>
    </div>
    <p id="loc-status" role="status" aria-live="polite" class="mt-2 hidden text-sm text-soil-600"></p>
  </div>
</div>

<div id="map-wrap" class="relative mt-2 h-[calc(100dvh-14rem)] min-h-[440px] overflow-hidden rounded-card border border-soil-200">
  <div id="map" class="h-full w-full" aria-label="Map of nearby farms"></div>

  <div id="sheet"
       class="absolute inset-x-0 bottom-0 z-[500] flex flex-col rounded-t-card border-t border-soil-200 bg-white shadow-[0_-8px_24px_rgba(38,37,22,0.25)]"
       style="height: 15rem;">
    <div id="sheet-handle"
         class="flex min-h-[3.5rem] shrink-0 cursor-grab items-center justify-between gap-2 border-b border-soil-100 px-4 py-2 touch-none select-none"
         title="Drag up for the full list, down for the full map">
      <span class="min-h-[24px] flex-1 basis-6"><span class="mx-auto block h-1.5 w-10 rounded-pill bg-soil-300"></span></span>
      <h2 id="sheet-title" class="text-sm font-bold text-soil-800">Loading farms…</h2>
      <button id="sheet-toggle" type="button" aria-label="Expand farm list"
              class="flex h-9 w-9 items-center justify-center rounded-lg text-soil-500 hover:bg-soil-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M14.77 12.78a.75.75 0 0 1-1.06 0L10 9.06l-3.72 3.72a.75.75 0 1 1-1.06-1.06l4.25-4.25a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06Z" clip-rule="evenodd"/>
        </svg>
      </button>
    </div>
    <div id="sheet-banner" role="status" aria-live="polite" class="hidden shrink-0 border-b border-harvest-100 bg-harvest-50 px-4 py-2 text-sm font-medium text-soil-800"></div>
    <div id="sheet-body" class="flex-1 space-y-3 overflow-y-auto px-3 py-3">
      <div class="skeleton-card"><div class="skeleton-line w-1/3 !mt-0"></div><div class="skeleton-line w-1/4 !h-2"></div><div class="skeleton-line w-full"></div><div class="skeleton-line w-2/3"></div></div>
      <div class="skeleton-card"><div class="skeleton-line w-1/2 !mt-0"></div><div class="skeleton-line w-1/3 !h-2"></div><div class="skeleton-line w-full"></div></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  const PLACES = {{ places_json | safe }};
  const MAP_CENTER = {{ map_center | safe }};
  const MAP_ZOOM = {{ map_zoom }};

  // ---- elements ----
  const chipText = document.getElementById('chip-location-text');
  const chipLoc = document.getElementById('chip-location');
  const popover = document.getElementById('loc-popover');
  const placeSelect = document.getElementById('place-select');
  const radiusInput = document.getElementById('radius-input');
  const radiusLabel = document.getElementById('radius-label');
  const locStatus = document.getElementById('loc-status');
  const pillRow = document.getElementById('pill-row');
  const sheet = document.getElementById('sheet');
  const sheetTitle = document.getElementById('sheet-title');
  const sheetBody = document.getElementById('sheet-body');
  const sheetBanner = document.getElementById('sheet-banner');
  const mapWrap = document.getElementById('map-wrap');

  // ---- state ----
  const params0 = new URLSearchParams(window.location.search);
  let product = params0.get('product') || '';
  let radius = 15;
  let origin = null;      // {lat, lng, label}
  let farms = [];         // unfiltered 15 km dataset for the current origin
  let markersById = {};

  function placeBySlug(slug) { return PLACES.find(p => p.slug === slug) || null; }

  // ---- map init ----
  const map = L.map('map');
  // Standard OSM tiles, visually muted in CSS (see .leaflet-tile filter) —
  // Carto's light style now requires an API key, so we stay terms-safe.
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a class="underline" href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);
  const cluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 45 });
  map.addLayer(cluster);
  // always show a sane view, even before data arrives
  const place0 = placeBySlug(params0.get('place')) || PLACES[0] || { lat: MAP_CENTER[0], lng: MAP_CENTER[1], name: 'Kisii', radius: MAP_ZOOM };
  map.setView([place0.lat, place0.lng], MAP_ZOOM);

  // ---- sheets & sizing ----
  const H = { collapsed: 56, peek: 0, expanded: 0 };
  function computeSizes() {
    const total = mapWrap.clientHeight;
    H.expanded = Math.round(total * 0.82);
    H.peek = Math.min(320, Math.round(total * 0.45));
  }
  computeSizes();
  sheet.style.height = H.peek + 'px';
  let sheetState = 'peek';

  function setSheet(px, stateLabel) {
    sheet.style.height = px + 'px';
    sheetState = stateLabel;
    document.getElementById('sheet-toggle').style.transform =
      sheetState === 'expanded' ? 'rotate(180deg)' : '';
  }

  const handle = document.getElementById('sheet-handle');
  let dragStartY = 0, dragStartH = 0, dragging = false;
  handle.addEventListener('pointerdown', e => {
    dragging = true; dragStartY = e.clientY; dragStartH = sheet.offsetHeight;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if (!dragging) return;
    const h = Math.max(H.collapsed, Math.min(H.expanded, dragStartH - (e.clientY - dragStartY)));
    sheet.style.height = h + 'px';
  });
  handle.addEventListener('pointerup', e => {
    dragging = false;
    const h = sheet.offsetHeight;
    const target = [H.collapsed, H.peek, H.expanded].reduce((a, b) =>
      Math.abs(b - h) < Math.abs(a - h) ? b : a);
    setSheet(target, target === H.expanded ? 'expanded' : target === H.peek ? 'peek' : 'collapsed');
  });
  document.getElementById('sheet-toggle').addEventListener('click', () => {
    setSheet(sheetState === 'expanded' ? H.peek : H.expanded, sheetState === 'expanded' ? 'peek' : 'expanded');
  });
  window.addEventListener('resize', () => {
    computeSizes();
    setSheet(H[sheetState] || H.peek, sheetState);
    map.invalidateSize();
  });
  // the viewport can settle after Leaflet measured its container (mobile
  // toolbars, dvh resolution) — re-measure once on first paint
  window.addEventListener('load', () => map.invalidateSize());

  // ---- rendering ----
  function skeleton() {
    sheetTitle.textContent = 'Loading farms…';
    sheetBody.innerHTML =
      `<div class="skeleton-card"><div class="skeleton-line w-1/3 !mt-0"></div><div class="skeleton-line w-1/4 !h-2"></div><div class="skeleton-line w-full"></div><div class="skeleton-line w-2/3"></div></div>` +
      `<div class="skeleton-card"><div class="skeleton-line w-1/2 !mt-0"></div><div class="skeleton-line w-1/3 !h-2"></div><div class="skeleton-line w-full"></div></div>`;
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function cardHTML(f) {
    const rows = f.listings.map(l =>
      `<div class="flex items-baseline justify-between gap-3 py-1">
         <span class="font-medium text-soil-800">${esc(l.product)}</span>
         <span class="text-right">${l.price_kes
           ? `<span class="font-mono text-sm font-bold text-leaf-800">KES ${esc(l.price_kes)}</span>` : '<span class="text-xs text-soil-500">ask farmer</span>'}
           ${l.quantity_note ? `<span class="block text-xs text-soil-500">${esc(l.quantity_note)}</span>` : ''}</span>
       </div>`).join('');
    return `
      <article class="farm-card rounded-card border border-soil-200 bg-white p-4" data-farm="${f.id}">
        <div class="flex items-start justify-between gap-3">
          <div>
            <h3 class="font-display text-lg font-bold leading-snug text-soil-900">${esc(f.name)}</h3>
            <p class="mt-0.5 text-xs text-soil-500">≈ ${f.distance_km} km${f.pickup_hours ? ' · ' + esc(f.pickup_hours) : ''}</p>
          </div>
          <span class="badge-available shrink-0">Available today</span>
        </div>
        <div class="mt-2 divide-y divide-soil-100 text-sm">${rows}</div>
        <div class="mt-3 flex gap-2">
          <a class="btn btn-primary min-h-[44px] flex-1 py-2 text-xs" href="/map/contact/${f.id}/call/">Call</a>
          <a class="btn btn-secondary min-h-[44px] flex-1 py-2 text-xs" href="/map/contact/${f.id}/whatsapp/">WhatsApp</a>
        </div>
      </article>`;
  }

  function filtered() {
    return farms.filter(f =>
      (!product || f.listings.some(l => l.product_slug === product)) &&
      f.distance_km <= radius + 0.25);
  }

  function render() {
    const list = filtered();
    if (origin) chipText.textContent = `Near ${origin.label} · ${radius} km`;

    // pills with counts (within current radius)
    pillRow.querySelectorAll('[data-count]').forEach(el => {
      const slug = el.closest('[data-product]').dataset.product;
      const n = slug === '' ? list.length : list.filter(f => f.listings.some(l => l.product_slug === slug)).length;
      el.textContent = n;
    });
    pillRow.querySelectorAll('[data-product]').forEach(b => {
      b.classList.toggle('chip-active', b.dataset.product === product);
      b.classList.toggle('chip-idle', b.dataset.product !== product);
    });

    // sheet title + banner
    const label = origin ? origin.label : 'your area';
    sheetBanner.classList.add('hidden');
    if (list.length) {
      sheetTitle.textContent = `${list.length} farm${list.length === 1 ? '' : 's'} near ${label} · ${radius} km`;
    } else {
      const what = product ? product : 'farms';
      sheetTitle.textContent = `No ${what} within ${radius} km`;
    }

    // cards
    if (!list.length) {
      sheetBody.innerHTML =
        `<div class="rounded-card border border-dashed border-soil-300 p-5 text-center">
           <p class="text-sm leading-relaxed text-soil-700">No farms with
           <strong>${esc(product || 'active listings')}</strong> within ${radius} km of ${esc(label)}.</p>
           ${radius < 15 ? '<button id="btn-widen" type="button" class="btn btn-secondary mx-auto mt-3 px-5">Widen to 15 km</button>' : ''}
         </div>`;
      const widen = document.getElementById('btn-widen');
      if (widen) widen.addEventListener('click', () => {
        radius = 15; radiusInput.value = 15; radiusLabel.textContent = '15 km'; render();
      });
    } else {
      sheetBody.innerHTML = list.map(cardHTML).join('');
      sheetBody.querySelectorAll('.farm-card').forEach(card => {
        card.addEventListener('click', e => {
          if (e.target.closest('a')) return;
          focusFarm(Number(card.dataset.farm));
        });
      });
    }

    renderMarkers(list);
  }

  function pinHTML(f) {
    const l = f.listings[0];
    const text = l && l.price_kes ? 'KES ' + l.price_kes : (l ? l.product : 'Farm');
    return `<span>${esc(text)}</span>`;
  }

  function renderMarkers(list) {
    cluster.clearLayers();
    markersById = {};
    for (const f of list) {
      const m = L.marker([f.pin.lat, f.pin.lng], {
        icon: L.divIcon({ className: 'pin-chip', html: pinHTML(f), iconSize: null }),
      });
      m.bindPopup(
        `<strong class="text-base font-display">${esc(f.name)}</strong>` +
        `<br><span style="color:#6F6B59">≈ ${f.distance_km} km away</span>` +
        `<br>` + f.listings.map(l =>
          `${esc(l.product)}${l.price_kes ? ' — KES ' + esc(l.price_kes) : ''}`).join('<br>') +
        `<br><a class="font-semibold underline" href="/map/farm/${f.id}/">Details &amp; contact</a>`
      );
      m.on('click', () => highlightCard(f.id));
      markersById[f.id] = m;
      cluster.addLayer(m);
    }
    if (list.length) {
      map.fitBounds(cluster.getBounds().pad(0.2));
    } else {
      map.fitBounds(L.latLng(origin.lat, origin.lng).toBounds(radius * 2 * 1.2));
    }
  }

  function highlightCard(id) {
    sheetBody.querySelectorAll('.farm-card').forEach(c => c.classList.remove('farm-card-highlight', 'ring-2'));
    const card = sheetBody.querySelector(`.farm-card[data-farm="${id}"]`);
    if (!card) return;
    card.classList.add('farm-card-highlight');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function focusFarm(id) {
    const m = markersById[id];
    if (!m) return;
    map.setView(m.getLatLng(), Math.max(map.getZoom(), 14));
    m.openPopup();
    highlightCard(id);
  }

  // ---- data ----
  function fetchFarms() {
    skeleton();
    const q = new URLSearchParams({ lat: origin.lat.toFixed(5), lng: origin.lng.toFixed(5) });
    fetch('/map/data/?' + q)
      .then(r => r.json())
      .then(data => {
        if (!data.farms) throw new Error('bad payload');
        farms = data.farms;
        sheetBanner.classList.add('hidden');
        render();
      })
      .catch(() => {
        // keep the last results on screen, but say clearly they may be stale
        if (farms.length) {
          sheetBanner.textContent = 'Cannot reach the server — showing the last results. They may be out of date; do not treat them as current.';
          sheetBanner.classList.remove('hidden');
          render();
        } else {
          sheetTitle.textContent = 'Cannot reach the server';
          sheetBody.innerHTML =
            `<div class="rounded-card border border-dashed border-soil-300 p-5 text-center text-sm text-soil-700">
               Check your connection and try again — we never show outdated listings as current.
             </div>`;
          cluster.clearLayers();
        }
      });
  }

  function setOrigin(o) {
    origin = o;
    chipText.textContent = `Near ${o.label} · ${radius} km`;
    syncUrl();
    map.setView([o.lat, o.lng], MAP_ZOOM);
    fetchFarms();
  }

  function syncUrl() {
    const q = new URLSearchParams();
    if (product) q.set('product', product);
    if (origin.slug) q.set('place', origin.slug);
    else { q.set('lat', origin.lat.toFixed(5)); q.set('lng', origin.lng.toFixed(5)); }
    if (radius !== 15) q.set('r', String(radius));
    history.replaceState(null, '', '/map/' + (q.toString() ? '?' + q.toString() : ''));
  }

  // ---- location popover ----
  function openPopover(open) {
    popover.hidden = !open;
    chipLoc.setAttribute('aria-expanded', String(open));
  }
  chipLoc.addEventListener('click', () => openPopover(popover.hidden));
  document.addEventListener('click', e => {
    if (!popover.hidden && !popover.contains(e.target) && !chipLoc.contains(e.target)) openPopover(false);
  });

  radiusInput.addEventListener('input', () => { radiusLabel.textContent = radiusInput.value + ' km'; });
  document.getElementById('btn-apply-area').addEventListener('click', () => {
    radius = Number(radiusInput.value);
    const slug = placeSelect.value;
    if (slug) {
      const p = placeBySlug(slug);
      setOrigin({ lat: p.lat, lng: p.lng, label: p.name, slug, radius: p.radius });
    } else {
      setOrigin({ lat: MAP_CENTER[0], lng: MAP_CENTER[1], label: 'map centre' });
    }
    openPopover(false);
  });
  document.getElementById('btn-use-location').addEventListener('click', () => {
    if (!navigator.geolocation) {
      locStatus.hidden = false;
      locStatus.textContent = 'This device cannot share a location — pick an area instead.';
      return;
    }
    locStatus.hidden = false;
    locStatus.textContent = 'Finding your location…';
    navigator.geolocation.getCurrentPosition(
      pos => {
        locStatus.hidden = true;
        radius = Number(radiusInput.value);
        setOrigin({ lat: pos.coords.latitude, lng: pos.coords.longitude, label: 'your location' });
        openPopover(false);
      },
      err => {
        locStatus.textContent = err.code === 1
          ? 'Location permission was denied. Pick an area from the list instead — that always works.'
          : 'Could not get your location. Pick an area from the list instead.';
      },
      { timeout: 8000 }
    );
  });

  // ---- product pills ----
  pillRow.addEventListener('click', e => {
    const b = e.target.closest('[data-product]');
    if (!b) return;
    product = b.dataset.product;
    syncUrl();
    render();
  });

  // ---- boot ----
  (function init() {
    computeSizes();
    const placeSlug = params0.get('place') && placeBySlug(params0.get('place')) ? params0.get('place') : (PLACES[0] ? PLACES[0].slug : '');
    const p = placeBySlug(placeSlug);
    if (p) {
      placeSelect.value = p.slug;
      radius = p.radius || 15;
    } else {
      radius = 15;
    }
    if (params0.get('r')) radius = Math.max(3, Math.min(15, Number(params0.get('r'))));
    radiusInput.value = radius;
    radiusLabel.textContent = radius + ' km';
    setOrigin({ lat: p ? p.lat : MAP_CENTER[0], lng: p ? p.lng : MAP_CENTER[1], label: p ? p.name : 'Kisii', slug: p ? p.slug : undefined });
  })();
</script>
{% endblock %}
