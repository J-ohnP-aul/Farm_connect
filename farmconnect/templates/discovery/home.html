{% extends "base.html" %}
{% block title %}Map — Local Farm Map{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
{% endblock %}
{% block content %}
<h1 class="sr-only">Nearby farms</h1>

<div class="mb-3 space-y-2">
  <nav class="flex flex-wrap gap-2" aria-label="Filter by product">
    <a class="chip {% if not selected_product %}chip-active{% else %}chip-idle{% endif %}"
       href="?{% if selected_place %}place={{ selected_place }}{% endif %}">All</a>
    {% for p in products %}
    <a class="chip {% if selected_product == p.slug %}chip-active{% else %}chip-idle{% endif %}"
       href="?product={{ p.slug }}{% if selected_place %}&amp;place={{ selected_place }}{% endif %}">{{ p.name }}</a>
    {% endfor %}
  </nav>
  <div class="flex flex-col gap-2 min-[420px]:flex-row">
    <select id="place-select" aria-label="Choose area"
            class="min-w-0 flex-1 rounded-lg border border-soil-300 bg-white px-3 py-2.5 text-base text-soil-900">
      <option value="">Choose area…</option>
      {% for pl in places %}
      <option value="{{ pl.slug }}" {% if selected_place == pl.slug %}selected{% endif %}>{{ pl.name }}</option>
      {% endfor %}
    </select>
    <div class="flex gap-2">
      <button id="btn-area" class="btn btn-primary flex-1 min-[420px]:flex-none" type="button">Search</button>
      <button id="btn-here" class="btn btn-secondary flex-1 min-[420px]:flex-none" type="button">My location</button>
    </div>
  </div>
</div>

<div id="map" class="h-[65vh] min-h-[300px] w-full overflow-hidden rounded-card border border-soil-200 bg-soil-100" aria-label="Map of nearby farms"></div>

<div id="empty-state" role="status" aria-live="polite"
     class="mt-3 rounded-card border border-harvest-300 bg-harvest-50 px-4 py-3 text-sm font-medium text-soil-800">
  Loading farms near you…
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const PLACES = {{ places_json | safe }};
  const MAP_CENTER = {{ map_center | safe }};
  const MAP_ZOOM = {{ map_zoom }};

  const select = document.getElementById('place-select');
  const emptyEl = document.getElementById('empty-state');

  function showNotice(text) {
    emptyEl.hidden = false;
    emptyEl.textContent = text;
  }

  // Leaflet renders no tiles until a view is set, so always start with one
  // (URL place -> first place -> settings default).
  const params0 = new URLSearchParams(window.location.search);
  if (params0.get('place') && select.querySelector(`option[value="${params0.get('place')}"]`)) {
    select.value = params0.get('place');
  }
  const initial = PLACES.find(p => p.slug === (select.value || params0.get('place')))
    || PLACES[0] || { lat: MAP_CENTER[0], lng: MAP_CENTER[1] };
  const map = L.map('map').setView([initial.lat, initial.lng], MAP_ZOOM);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a class="underline" href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);

  let markers = L.featureGroup().addTo(map);  // featureGroup adds getBounds()

  function render(farms) {
    markers.clearLayers();
    if (!farms.length) {
      showNotice('No farms found with active listings here today. Try another product or area.');
      return;
    }
    emptyEl.hidden = true;
    for (const farm of farms) {
      const marker = L.circleMarker([farm.pin.lat, farm.pin.lng], {
        radius: 10,
        weight: 2,
        color: '#FAF9F4',
        fillColor: farm.pin.approximate ? '#2B5A31' : '#C2761B',
        fillOpacity: 0.95,
      });
      marker.bindPopup(
        `<strong class="text-base">${farm.name}</strong>` +
        `<br><span class="text-soil-500">≈ ${farm.distance_km} km away</span>` +
        `<br>` + farm.listings.map(l =>
          `${l.product}${l.price_kes ? ' — KES ' + l.price_kes : ''}` +
          (l.quantity_note ? ` <span class="text-soil-500">(${l.quantity_note})</span>` : '')
        ).join('<br>') +
        (farm.pickup_hours ? `<br><em>${farm.pickup_hours}</em>` : '') +
        `<br><a class="font-semibold underline" href="/map/farm/${farm.id}/">Details &amp; contact</a>`
      );
      markers.addLayer(marker);
    }
    map.fitBounds(markers.getBounds().pad(0.25));
  }

  function load(params) {
    fetch('/map/data/?' + params)
      .then(r => r.json())
      .then(data => {
        if (data.farms) render(data.farms);
      })
      .catch(() => {
        showNotice('Could not reach the server. Check your connection and press Search again — we never show outdated listings as if they were current.');
      });
  }

  function syncUrl(q) {
    history.replaceState(null, '', '/map/' + (q.toString() ? '?' + q.toString() : ''));
  }

  // Keep the product filter when re-searching a new area
  function queryWithArea(placeSlug) {
    const q = new URLSearchParams(window.location.search);
    q.delete('lat'); q.delete('lng'); q.delete('place');
    if (placeSlug) q.set('place', placeSlug);
    return q;
  }

  function searchArea() {
    const slug = select.value;
    const q = queryWithArea(slug);
    syncUrl(q);
    showNotice('Loading farms near you…');
    const place = PLACES.find(p => p.slug === slug);
    if (place) map.setView([place.lat, place.lng], MAP_ZOOM);
    load(q);
  }

  function searchHere() {
    if (!navigator.geolocation) {
      showNotice('This device cannot share a location. Choose an area and press Search.');
      return;
    }
    showNotice('Finding your location…');
    navigator.geolocation.getCurrentPosition(
      pos => {
        const q = new URLSearchParams(window.location.search);
        q.delete('place');
        q.set('lat', pos.coords.latitude.toFixed(5));
        q.set('lng', pos.coords.longitude.toFixed(5));
        syncUrl(q);
        map.setView([pos.coords.latitude, pos.coords.longitude], Math.max(MAP_ZOOM, 13));
        showNotice('Loading farms near you…');
        load(q);
      },
      () => {
        showNotice('Could not get your location (permission denied?). Choose an area and press Search.');
      },
      { timeout: 8000 }
    );
  }

  document.getElementById('btn-area').addEventListener('click', searchArea);
  document.getElementById('btn-here').addEventListener('click', searchHere);

  // Initial load: honour URL place/GPS, otherwise default to the first
  // curated area. The browser location prompt fires only on "My location".
  (function init() {
    const q = new URLSearchParams(window.location.search);
    if (q.get('place') || (q.get('lat') && q.get('lng'))) {
      load(q);
    } else {
      const first = PLACES[0];
      if (first) { select.value = first.slug; q.set('place', first.slug); syncUrl(q); }
      load(q);
    }
  })();
</script>
{% endblock %}
